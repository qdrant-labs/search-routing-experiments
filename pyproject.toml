[project]
name = "hybrid-search-rrf-dataset"
version = "0.1.0"
description = ""
authors = [
    {name = "andrei.cristea",email = "andrei.cristea@qdrant.com"}
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "ir-datasets (>=0.6.1,<0.7.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "pyarrow (>=24.0.0,<25.0.0)",
    "fastembed (>=0.8.0,<0.9.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "qdrant-client (>=1.18.0,<2.0.0)",
    "tqdm (>=4.68.3,<5.0.0)",
    "ranx (>=0.3.21,<0.4.0)",
    "requests (>=2.34.2,<3.0.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "datasets (>=4.0.0)",
    "query-taxonomy",
    "rstr (>=3.2.2)",
    "mcp (>=1.28.1,<2.0.0)",
    "litellm (>=1.93.0,<2.0.0)",
    "instructor (>=1.15.4,<2.0.0)",
    "sentence-transformers (>=5.6.1,<6.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "wordfreq (>=3.1.1,<4.0.0)",
    "torch (>=2.6.0,<3.0.0)",
    "lightgbm (>=4.5.0,<5.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)"
]


[tool.poetry]
packages = [
    {include = "hybrid_search_rrf_dataset", from = "src"},
    {include = "dataset_registry", from = "src"},
    {include = "composition", from = "src"},
    {include = "taxonomy_generators", from = "src"},
    {include = "encoder_router", from = "src"},
    {include = "router_service", from = "src"},
    # A single module, not a package: the three lazy __init__ files share it,
    # and it belongs to none of them (dataset_registry is imported BY
    # hybrid_search_rrf_dataset.lanes, so either home inverts a dependency).
    {include = "lazy_exports.py", from = "src"},
]

[tool.poetry.dependencies]
query-taxonomy = { path = "src/query-taxonomy", develop = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Default ruff (E4/E7/E9 + F) plus pyupgrade (UP) and ruff-specific (RUF). extend-select
# keeps the defaults and avoids pulling in E501 line-length. Ruff is pinned <0.16 in dev
# and CI so the enabled set is identical in both — no version-default drift.
extend-select = ["UP", "RUF"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)",
    "ruff (>=0.15.20,<0.16.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "nbclient (>=0.11.0,<0.12.0)",
    "ipywidgets (>=8.1.9,<9.0.0)"
]
