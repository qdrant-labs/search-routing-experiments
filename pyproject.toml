[project]
name = "hybrid-search-rrf-dataset"
version = "0.1.0"
description = ""
authors = [
    {name = "andrei.cristea",email = "andrei.cristea@qdrant.com"}
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "ir-datasets (>=0.6.1,<0.7.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "pyarrow (>=24.0.0,<25.0.0)",
    "fastembed (>=0.8.0,<0.9.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "qdrant-client (>=1.18.0,<2.0.0)",
    "tqdm (>=4.68.3,<5.0.0)",
    "ranx (>=0.3.21,<0.4.0)",
    "requests (>=2.34.2,<3.0.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "datasets (>=4.0.0)",
    "mlcroissant (>=1.1.0,<2.0.0)",
    "gitpython (>=3.1.50,<4.0.0)",
    "query-taxonomy @ file:///Users/andrei/projects/hybrid-search-rrf-dataset/src/query-taxonomy",
    "rstr (>=3.2.2)",
    "mcp (>=1.28.1,<2.0.0)",
    "litellm (>=1.93.0,<2.0.0)",
    "instructor (>=1.15.4,<2.0.0)",
    "umap-learn (>=0.5.12,<0.6.0)",
    "anthropic (>=0.120.0,<0.121.0)",
    "sentence-transformers (>=5.6.1,<6.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]


[tool.poetry]
packages = [
    {include = "hybrid_search_rrf_dataset", from = "src"},
    {include = "dataset_registry", from = "src"},
    {include = "report_charts", from = "src"},
    {include = "composition", from = "src"},
    {include = "taxonomy_generators", from = "src"},
]

[tool.poetry.dependencies]
query-taxonomy = { develop = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)",
    "ruff (>=0.15.20,<0.16.0)",
    "pytest (>=9.1.1,<10.0.0)"
]
