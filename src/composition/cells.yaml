_note: Archetype cells for the Strategy Router composition. fable_5-generated spine; the eight pooled
  identifier cells had unbuilt-bank any_of branches trimmed so every band resolves to a live catalog column
  (re-add the branch when its bank ships). predicts is a falsifiable prior tested by labelling, never
  used to allocate. looks_like is LLM-facing guidance for constructing and recognizing member
  queries — it restates the cell's surface shape in plain language, says what must and must not
  appear, and, where predicts spans two routes, names the axis a generator should vary so labelling
  can split it. It paraphrases the predicate but never overrides it; the predicate columns are the
  sole matcher and win any disagreement.
cells:
- name: bare_concept_token
  looks_like: >
    One or two plain words naming a single ordinary concept — the head of the shortest-query
    distribution, the thing typed into a search box a thousand times a day. Build it from common
    vocabulary an encoder has seen everywhere: a bare topic noun or a two-word noun phrase. No
    digits, no acronyms, no code, nothing verbatim-rare — opaque jargon belongs to the identifier
    cells. The cell tests whether the cleanest concept-shaped queries really do go dense, so keep
    the concept clean and well-known.
  predicate:
  - column: length.length_words
    below: 3
  - column: structured_identifiers.number
    below: 1
  predicts:
  - dense_only
  rationale: One or two words naming a single concept give the embedding a clean, well-trained point in
    space, while BM25 holds a single medium-IDF term with no way to break ties among the thousands of
    documents containing it. The counter-mechanism is the token being rare verbatim jargon, but that regime
    is claimed by the opaque-token cells; here the falsifiable claim is that the head of the shortest-query
    distribution goes dense.
  source: fable_5
- name: short_grammatical_question
  looks_like: >
    A complete miniature question of three to six words that reads as real grammar — a question
    word, a verb, and only two or three content words carrying the entire need. No digits, no
    identifiers, and not a keyword telegram: it must sound like something asked aloud. Construct
    variants on the deciding axis — sometimes the content words are exactly the vocabulary an
    answering passage would use, sometimes an everyday paraphrase of it — since that phrasing
    choice, not any corpus, is what splits the route.
  predicate:
  - column: length.length_words
    at_least: 3
    below: 7
  - column: natural_language_signal.natural_language_share
    at_least: 0.4
  - column: structured_identifiers.number
    below: 1
  predicts:
  - dense_only
  - sparse_only
  rationale: A short question whose token budget is mostly closed-class leaves two or three content words
    to carry the need. The route flips on whether those words are the target passage's literal vocabulary
    or a paraphrase of it — a property of phrasing choice and term rarity, not of any corpus — so both
    outcomes are genuinely available in the highest-traffic region.
  source: fable_5
- name: stopword_saturated_midlength
  looks_like: >
    A full conversational sentence of seven to nineteen words in which nearly half the tokens are
    function words — the, of, to, is, in, my — so only three to five content words carry the
    need, buried in grammar. No digits or identifiers anywhere. Write it the way a person types a
    whole sentence into a chat box, and vary whether the few surviving content words are the
    answer's literal vocabulary or a paraphrase of it — that contest is exactly what the cell is
    built to label.
  predicate:
  - column: length.length_words
    at_least: 7
    below: 20
  - column: stopword_ratio.stopword_ratio
    at_least: 0.45
  - column: structured_identifiers.number
    below: 1
  predicts:
  - dense_only
  - sparse_only
  rationale: 'Extends the buried-anchor shape into full-sentence territory: BM25 discards roughly half
    the tokens and scores on the three-to-five surviving content words, while dense reads the complete
    syntax including the relations the function words encode. The route follows whether the surviving
    content words are the discriminating vocabulary of the answer or a paraphrase of it.'
  source: fable_5
- name: verbose_grammatical_request
  looks_like: >
    A long, fully grammatical ask of twenty to sixty words — one elaborate sentence or a few
    flowing ones — where context, qualifiers, and the actual request are woven into natural
    prose. Not pasted material and not a keyword string: it should read as deliberately written
    language. Vary how much of the query's vocabulary an answering document would share verbatim,
    because heavy overlap is the condition under which rank fusion can beat either retriever
    alone.
  predicate:
  - column: length.length_words
    at_least: 20
    below: 60
  - column: natural_language_signal.natural_language_share
    at_least: 0.4
  predicts:
  - dense_only
  - pure_rrf
  rationale: 'A long grammatical ask gives dense a full intent to compress, while BM25 receives many medium-IDF
    content terms whose union over-matches tangential documents. RRF has a specific opening: when query
    and target vocabulary largely coincide, both retrievers rank the same document highly for independent
    reasons, and rank aggregation is more stable at rank 1 than either list alone.'
  source: fable_5
- name: extreme_length_pasted_query
  looks_like: >
    Sixty words or more — no longer a typed question but a dropped-in passage: a paragraph from a
    document, a whole ticket description, a long email excerpt, with a thin ask attached or none
    at all. Make it feel genuinely pasted, with many facets sitting side by side, so a single
    vector must average them while lexical matching receives dozens of independent anchors.
    Include variants where one verbatim-rich stretch could decide the match and variants where
    only the overall gist can.
  predicate:
  - column: length.length_words
    at_least: 60
  predicts:
  - dense_only
  - sparse_only
  rationale: Sixty-plus words is no longer a question but a pasted passage. A single-vector embedding
    must average many facets and may truncate, while BM25 turns the same input into dozens of independent
    anchors with TF saturation — effectively document-to-document matching, where lexical methods are
    historically strong. Both mechanisms are real, so the route is genuinely contested at this length.
  source: fable_5
- name: high_morphological_variation
  looks_like: >
    A natural-language query of three to nineteen words in which over a third of the words are
    inflected or derived forms rather than dictionary base forms — plurals, -ing and -ed forms,
    -ization and -ability derivations, comparatives. It should still read as ordinary language,
    just morphology-heavy. Choose word forms an answering document would plausibly write
    differently, because the cell tests what happens when exact matching depends on a stemmer
    conflating the query form with the document form.
  predicate:
  - column: morphology.word_variation_share
    at_least: 0.35
  - column: natural_language_signal.natural_language_share
    at_least: 0.25
  - column: length.length_words
    at_least: 3
    below: 20
  predicts:
  - dense_only
  - sparse_only
  rationale: When a large share of tokens are inflected or derived forms, exact matching depends on the
    analyzer's stemmer happening to conflate the query form with the document form — a per-term coin flip.
    The encoder normalizes morphology, so dense should degrade less; sparse stays available when stems
    do align or when an inflected variant is itself the rare discriminating form.
  source: fable_5
- name: deep_nesting_single_sentence
  looks_like: >
    One single grammatical sentence — never two — whose clauses telescope at least six levels
    deep: a relative clause inside a conditional inside a complement, so the meaning lives in who
    did what to whom under which condition rather than in any individual word. It must parse as
    real language, not word salad. Keep every content word common: a rare term that could decide
    the match by itself defeats the purpose, which is to isolate compositional structure as the
    only available signal.
  predicate:
  - column: syntactic_depth.nesting_depth
    at_least: 6
  - column: syntactic_depth.statement_count
    below: 2
  - column: natural_language_signal.natural_language_share
    at_least: 0.25
  predicts:
  - dense_only
  rationale: A single deeply embedded sentence puts the meaning in the composition — who did what to whom
    under which condition — which a bag-of-words model flattens away entirely, while dense encodes at
    least part of that structure. The NL floor keeps the parser honest, since depth is hallucinated on
    non-sentences. The counter-mechanism is a rare term deciding the match regardless of structure, which
    the predicate does not select for, so structure should dominate.
  source: fable_5
- name: multi_statement_context_dump
  looks_like: >
    Three or more separate statements totalling at least twenty words, written the way people
    fill a support box: a sentence of background, a sentence of what changed or was tried, then
    the actual ask. Let the statements carry different kinds of evidence — semantic framing in
    one, specific content terms in another, some of it irrelevant background — so that no single
    reading of the dump suffices and the real ask genuinely risks dilution inside it.
  predicate:
  - column: syntactic_depth.statement_count
    at_least: 3
  - column: length.length_words
    at_least: 20
  - column: natural_language_signal.natural_language_share
    at_least: 0.25
  predicts:
  - dense_only
  - pure_rrf
  rationale: 'Several clauses mean background plus an actual ask: dense compresses the whole and risks
    diluting the ask, sparse harvests rare terms from every clause including irrelevant background. RRF''s
    specific mechanism here is that the two retrievers fail on different clauses, and documents satisfying
    the union of partial evidence — usually the truly relevant ones — survive as the consensus.'
  source: fable_5
- name: wide_flat_enumeration
  looks_like: >
    A query whose spine is a flat coordination of three or more parallel items — comma- or and-
    joined entities, features, or options — with at most a thin frame around the list. The list
    is the payload; this is the known worst case for a single vector, which averages the facets
    into a centroid near none of them. Vary whether the frame around the items — difference,
    compatibility, ranking — carries real intent, because a meaningful frame is what fusion can
    add on top of raw item coverage.
  predicate:
  - column: coordination.widest_list_size
    at_least: 3
  - column: natural_language_signal.natural_language_share
    at_least: 0.1
  - column: length.length_words
    at_least: 3
  predicts:
  - sparse_only
  - pure_rrf
  rationale: 'A coordination chain of three or more items is a multi-facet query — the known worst case
    for a single vector, which averages the facets into a centroid near none of them — while BM25 scores
    coverage across the items natively. RRF is live when the frame around the list (difference, compatibility,
    ranking) is what dense contributes while sparse contributes item coverage: complementary evidence
    converging on the same documents.'
  source: fable_5
- name: keyword_telegram_short
  looks_like: >
    Three to six bare content words with zero connective grammar — the classic search telegram:
    no question word, no article, no preposition, no digits, every token load-bearing. Use
    ordinary vocabulary words, not code symbols or opaque identifiers; those belong to the symbol
    and identifier cells. The cell exists to test the assumption that telegram style implies
    sparse, so build variants where the keywords are the target's literal terms and variants
    where they are loose synonyms of them.
  predicate:
  - column: natural_language_signal.natural_language_share
    below: 0.1
  - column: length.length_words
    at_least: 3
    below: 7
  - column: structured_identifiers.number
    below: 1
  predicts:
  - dense_only
  - sparse_only
  rationale: 'The classic keyword telegram: no closed-class tokens, every term load-bearing. The taxonomy''s
    working assumption is telegram implies sparse, but syntax-free input also just reduces both retrievers
    to term semantics — embeddings still resolve synonymy between keywords and document phrasing. This
    cell exists to test the telegram-to-sparse assumption rather than encode it.'
  source: fable_5
- name: negation_bearing_question
  looks_like: >
    A natural query of three to nineteen words whose meaning pivots on an explicit negator — not,
    without, never, no longer, except. Construct it so the negation matters: flipping it must
    change which documents count as correct answers. Keep the remainder ordinary language, and
    vary how discriminating that non-negated residue is on its own, because the cell measures
    whether negation should modulate routing confidence when both retrievers mostly act on the
    residue anyway.
  predicate:
  - column: sentence_markers.negation
    at_least: 1
  - column: natural_language_signal.natural_language_share
    at_least: 0.25
  - column: length.length_words
    at_least: 3
    below: 20
  predicts:
  - dense_only
  - sparse_only
  rationale: In principle only dense can represent a negator, since bag-of-words treats the negated term
    as a positive match and the negator as a near-stopword; in practice bi-encoders score close to chance
    on negation benchmarks, so both retrievers largely act on the non-negated residue. The prior spans
    both routes because the winner is decided by that residue, and the cell tests whether negation should
    modulate routing confidence at all.
  source: fable_5
- name: comparative_multi_entity
  looks_like: >
    An explicit comparison naming at least two comparable entities side by side — an X-versus-Y,
    a better-or-worse-than, a which-should-I-choose — with the comparative marker and both entity
    names present. The trap under test is each retriever surfacing documents about one entity
    alone while the relevant target covers the relation, so pick entity pairs where single-entity
    material plausibly dominates the corpus and only relation-bearing documents truly answer.
  predicate:
  - column: sentence_markers.comparative
    at_least: 1
  - column: coordination.widest_list_size
    at_least: 2
  - column: natural_language_signal.natural_language_share
    at_least: 0.1
  predicts:
  - dense_only
  - pure_rrf
  rationale: 'X-versus-Y queries let each retriever happily surface documents about one entity alone;
    the relevant document must cover the relation. Dense can represent the comparative frame directly.
    RRF''s concrete mechanism: documents mentioning both entities receive moderate rank from both retrievers,
    and rank fusion promotes exactly that consensus over each retriever''s single-entity toplist.'
  source: fable_5
- name: conversational_courtesy_wrapper
  looks_like: >
    A request swaddled in chat courtesy — a greeting, a please or thanks, maybe a stray
    interjection — at least ten words in total and drenched in function words, with the actual
    need a small kernel inside the padding. Write it as a person opening a conversation, not
    composing a search. Keep the kernel's vocabulary ordinary: the stated counter-mechanism is a
    rare content term surviving inside the padding, so one must not sneak in by accident.
  predicate:
  - column: stopword_ratio.stopword_ratio
    at_least: 0.4
  - column: length.length_words
    at_least: 10
  any_of:
  - column: sentence_markers.greeting
    at_least: 1
  - column: sentence_markers.politeness
    at_least: 1
  - column: sentence_markers.interjection
    at_least: 1
  predicts:
  - dense_only
  rationale: Greetings and courtesy padding are pure noise to BM25 — near-zero-IDF terms that dilute score
    mass — while instruction-tuned embedders were trained on precisely this register and locate the request
    despite the wrapper. Sparse competes only when a rare content term survives inside the padding, which
    the predicate does not require; that is the stated counter-mechanism.
  source: fable_5
  operator: decorate
- name: bare_acronym
  looks_like: >
    An acronym standing alone or with at most one companion word — capitals, typically two to six
    letters, nothing else around it. Span the deciding axis deliberately: famous acronyms that
    function as first-class entities in training data, obscure ones — a niche committee, an
    internal protocol — that are effectively opaque rare strings, and the murky middle. Fame
    versus rarity is a property of the token itself, and it is precisely the property under test.
  predicate:
  - column: sentence_markers.acronym
    at_least: 1
  - column: length.length_words
    below: 3
  predicts:
  - dense_only
  - sparse_only
  rationale: 'A naked acronym''s route is a function of its token statistics alone: a famous acronym is
    a first-class semantic entity dense places precisely, an obscure one is an opaque rare string only
    exact match reaches. Fame versus rarity is a property of the query token, so both routes arise within
    one shape for query reasons.'
  source: fable_5
  operator: stat_rewrite
- name: acronym_inside_question
  looks_like: >
    A fully grammatical question of seven to nineteen words with an acronym embedded as its key
    term — a hard lexical anchor inside a sentence that supplies the intent. Keep the surrounding
    words plain so the acronym stays the sharpest token present. Vary whether plausible targets
    would use the acronym verbatim throughout or alternate it with the spelled-out expansion —
    verbatim consistency versus alternation is exactly what separates the two predicted routes.
  predicate:
  - column: sentence_markers.acronym
    at_least: 1
  - column: natural_language_signal.natural_language_share
    at_least: 0.4
  - column: length.length_words
    at_least: 7
    below: 20
  predicts:
  - sparse_only
  - pure_rrf
  rationale: The acronym supplies a hard lexical anchor while the surrounding question supplies intent
    that dense reads. Sparse wins outright when targets consistently use the acronym; fusion wins when
    targets alternate between acronym and expansion, so each retriever recovers a different verbalization
    of the same answer and the fused ranking covers both.
  source: fable_5
- name: pasted_code_fragment
  looks_like: >
    Actual pasted material — a code snippet, stack trace, or log excerpt running at least ten
    tokens — with essentially no natural-language framing. Braces, dots, camelCase, line noise:
    the artifact itself, not a description of it. Compose it the way real traces look, a few
    genuinely rare tokens — the user's own identifiers, the failing frame — drowning in
    boilerplate that every trace of that kind shares, and vary whether those rare symbols would
    occur verbatim in the answering document.
  predicate:
  - column: logical_structures.code_fragment
    at_least: 1
  - column: natural_language_signal.natural_language_share
    below: 0.1
  - column: length.length_words
    at_least: 10
  predicts:
  - sparse_only
  - pure_rrf
  rationale: A pasted snippet or trace holds a few genuinely rare symbols — the user's identifiers, the
    failing frame — drowning in boilerplate tokens shared by every trace of that kind. Sparse wins when
    the rare symbols occur verbatim in the answer; RRF's mechanism is dense recognizing the failure pattern
    semantically while sparse pins the specific symbols, different evidence converging on one document.
  source: fable_5
- name: code_symbol_named_in_prose
  looks_like: >
    A grammatical question of seven to nineteen words that names one or two code identifiers in
    passing — camelCase, snake_case, or a dotted API path inside otherwise normal prose. The
    controlled opposite of a symbol pile: mostly sentence, one hard anchor, usually the highest-
    IDF token present. Vary the intent around the symbol — deprecation, alternatives, why it
    misbehaves — and how crowded the symbol's documentation neighborhood plausibly is, since
    intent must select among the crowd when the anchor alone over-matches.
  predicate:
  - column: structured_identifiers.code_identifier
    at_least: 1
  - column: natural_language_signal.natural_language_share
    at_least: 0.4
  - column: length.length_words
    at_least: 7
    below: 20
  predicts:
  - sparse_only
  - pure_rrf
  rationale: 'The controlled opposite of a symbol pile: one API name embedded in a grammatical question.
    The symbol is usually the highest-IDF token and sparse anchors on it; fusion wins exactly when the
    question''s intent — deprecation, alternative, error cause — must select among the many documents
    containing the symbol, so anchor and intent are both required to reach rank 1.'
  source: fable_5
- name: symbol_pile_no_grammar
  looks_like: >
    Two or more bare technical tokens sitting side by side with no connective
    words at all — like a pasted stack-trace fragment or a list of symbols
    someone dropped into a search box. Not a question, not a sentence: no
    "how", "what", "the", "of", "in", "and".
  predicate:
  - column: structured_identifiers.code_identifier
    at_least: 2
  - column: natural_language_signal.natural_language_share
    below: 0.1
  - column: length.length_words
    below: 10
  predicts:
  - sparse_only
  rationale: Multiple identifiers with no connective grammar hand BM25 a conjunction of rare terms — the
    strongest lexical evidence available — while a general-text encoder receives subword fragments with
    no syntax to compose. The counter-mechanism would be a code-pretrained embedder that treats identifiers
    as vocabulary, which makes the single-route claim falsifiable rather than definitional.
  source: fable_5
- name: math_notation_present
  looks_like: >
    A query of up to nineteen words containing genuine mathematical notation — an equation, a
    symbolic expression, a formula fragment — bare or with a few framing words. Span both regimes
    deliberately: famous formulae that are memorized entities a model resolves as concepts, and
    arbitrary expressions that survive only as exact character runs at the mercy of analyzer
    tokenization. Which regime a given expression falls into is a property of the query token,
    and it is the property under test.
  predicate:
  - column: logical_structures.math_expression
    at_least: 1
  - column: length.length_words
    below: 20
  predicts:
  - dense_only
  - sparse_only
  rationale: 'Notation cuts both ways: famous formulae are memorized semantic entities an embedding resolves
    as concepts, while arbitrary expressions survive only as exact character runs that analyzer tokenization
    may or may not preserve. Which regime a given expression falls into is a property of the query token,
    so the shape legitimately produces both routes.'
  source: fable_5
- name: boolean_operator_query
  looks_like: >
    Search-engine command syntax with almost no natural language around it: uppercase AND, OR,
    NOT between terms, quoted exact phrases, plus or minus prefixes, field-style filters. Written
    by someone who believes they are programming the engine. Since neither retriever actually
    executes the operators, the route falls to the operand terms — so vary those from common
    vocabulary to rare decisive strings, and include NOT-queries where honoring the operator
    would actually change the answer set.
  predicate:
  - column: logical_structures.operator_syntax
    at_least: 1
  - column: natural_language_signal.natural_language_share
    below: 0.25
  predicts:
  - dense_only
  - sparse_only
  rationale: 'Uppercase boolean operators are retrieval commands neither engine executes: standard analyzers
    lowercase them into stopwords and rank rather than filter, while the encoder treats them as noisy
    capitalized function words. The operator semantics — especially NOT — are lost on both sides, so the
    route falls to the operands; the cell tests the taxonomy''s assumption that operator syntax marks
    a sparse query.'
  source: fable_5
  operator: operator_syntax_rewrite
- name: relative_temporal_no_dates
  looks_like: >
    A natural query that pins time relatively and only in words — latest, most recent, since the
    last release, from last week, before the change — with no concrete date token anywhere;
    writing an actual date breaks the cell. The temporal words are semantically pivotal but
    lexically near-worthless. Keep the non-temporal remainder ordinary too: a rare anchor
    sneaking in would hand the query to the residue and stop testing whether the temporal
    relation itself routes dense.
  predicate:
  - column: logical_structures.temporal
    at_least: 1
  - column: structured_identifiers.datetime
    below: 1
  - column: natural_language_signal.natural_language_share
    at_least: 0.25
  predicts:
  - dense_only
  rationale: 'Relative time in words — latest, since, three days ago — is semantically pivotal but lexically
    worthless: the terms are low-IDF, and BM25 either discards them or matches them meaninglessly across
    unrelated documents, while dense at least encodes the temporal relation. Sparse can only win through
    the non-temporal residue, which makes the single route the honest falsifiable prior.'
  source: fable_5
- name: datetime_token_present
  looks_like: >
    Three to nine words containing one concrete date or timestamp token. Rotate the surface form
    deliberately — ISO style, slashed, written-out month and day — because format agreement with
    the target is the entire axis: exact-form agreement makes the date a decisive anchor, while
    disagreement blinds exact match completely and leaves the surrounding words to recover the
    need. The format is chosen at query time, which is what makes this a query-side split worth
    labelling.
  predicate:
  - column: structured_identifiers.datetime
    at_least: 1
  - column: length.length_words
    at_least: 3
    below: 10
  predicts:
  - dense_only
  - sparse_only
  rationale: A concrete date is a moderately rare token whose surface form — 2024-03-01 versus March 1st
    — may or may not match the target's. Format agreement makes sparse decisive; disagreement blinds it
    entirely while dense recovers through surrounding context. The format is chosen at query time, so
    both routes arise for query reasons.
  source: fable_5
  operator: inject
- name: version_pinned_technical
  looks_like: >
    A short technical query of three to nine words pinned to an exact dotted version string that
    must appear verbatim — the kind of precision embeddings actively blur, since adjacent
    versions differ by the whole point. Vary the job of the surrounding words: sometimes the
    version alone tags the answer, as in changelogs and release notes; sometimes the accompanying
    vocabulary — breaking change, migration, incompatibility — must select the right document
    among the many that mention the same version.
  predicate:
  - column: structured_identifiers.version_string
    at_least: 1
  - column: length.length_words
    at_least: 3
    below: 10
  predicts:
  - sparse_only
  - pure_rrf
  rationale: Version strings are high-precision anchors that embeddings actively blur — 2.1.3 and 2.1.4
    are nearly identical vectors despite the difference being the entire point. Sparse wins when the exact
    version tags the answer; fusion wins when the version narrows the candidate set while the accompanying
    words (breaking change, migration) need semantic matching to pick the right document within it.
  source: fable_5
- name: status_code_idf_split
  looks_like: >
    A natural question of seven to nineteen words built around an error or status code. Span the
    code-rarity spectrum inside this one surface: ubiquitous codes that occur in millions of
    documents and anchor nothing, up through long vendor-specific codes rare enough to decide the
    match alone. The identifier's rarity — a query property — is the whole test; the cell
    embodies the principle that the mere presence of an identifier implies nothing about the
    route.
  predicate:
  - column: natural_language_signal.natural_language_share
    at_least: 0.25
  - column: length.length_words
    at_least: 7
    below: 20
  any_of:
  - column: structured_identifiers.error_code_like
    at_least: 1
  - column: structured_identifiers.http_status_code
    at_least: 1
  predicts:
  - dense_only
  - sparse_only
  rationale: 'This family spans the full IDF spectrum inside one surface shape: a 404 occurs in millions
    of documents and anchors nothing, while 0x80070005 occurs in a handful and decides the match alone.
    The identifier''s rarity — a query property — flips the route, directly embodying the principle that
    identifier presence per se implies nothing.'
  source: fable_5
- name: rare_key_buried_in_chatter
  looks_like: >
    Ten to sixty words of loose conversational chatter — hedges, function words, half-remembered
    context, the way someone rambles in a team channel — with exactly one decisive key adrift in
    it: a CVE identifier or a ticket-style key. The key must be the only sharp token; everything
    around it should be discardable filler. Vary whether plausible targets restate the key
    verbatim or discuss the issue in paraphrase without ever quoting it — the paraphrase case is
    fusion's specific opening.
  predicate:
  - column: stopword_ratio.stopword_ratio
    at_least: 0.4
